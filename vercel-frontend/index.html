<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI销售经验访谈系统</title>
    <script src="api-config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI销售经验访谈系统</h1>
            <p class="subtitle">将您的隐性经验转化为结构化资产</p>
        </div>

        <div class="form-card">
            <h2>开始您的访谈</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="role">👤 您的角色：</label>
                    <select id="role" name="role" required>
                        <option value="">请选择...</option>
                        <option value="AE">AE（客户经理）</option>
                        <option value="SDR">SDR（销售代表）</option>
                        <option value="BD">BD（商务拓展）</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="experience_years">📊 从业年限：</label>
                    <input type="number" id="experience_years" name="experience_years" min="0" max="30" required placeholder="例如：3">
                </div>

                <div class="form-group">
                    <label for="industry">🏢 所在行业：</label>
                    <input type="text" id="industry" name="industry" required placeholder="例如：SaaS、医疗、制造">
                </div>

                <div class="form-group">
                    <label for="sales_stage">🎯 访谈场景：</label>
                    <select id="sales_stage" name="sales_stage" required>
                        <option value="">请选择...</option>
                        <option value="售前">售前</option>
                        <option value="售中">售中</option>
                        <option value="售后">售后</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="task_focus">💬 访谈聚焦：</label>
                    <input type="text" id="task_focus" name="task_focus" required placeholder="例如：首次客户拜访、需求挖掘">
                </div>

                <button type="submit" class="btn-primary">开始访谈 ✨</button>
            </form>
        </div>

        <div class="info-box">
            <h3>💡 什么是AI访谈？</h3>
            <p>AI会像一位经验丰富的OD专家，通过9个阶段的深度对话，帮助您梳理工作中的关键经验和方法论，并将这些隐性知识转化为结构化的文档。</p>
            <h3>⏱️ 预计时间</h3>
            <p>完成一次访谈大约需要15-30分钟</p>
        </div>

        <div class="form-card" style="margin-top: 30px;">
            <h2>📊 查看已有访谈结果</h2>
            <p>输入Session ID查看已完成的访谈结果：</p>
            <div class="form-group">
                <input type="text" id="view_session_id" placeholder="例如：20260317134309-BD" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <button type="button" class="btn-primary" onclick="viewResult()">查看结果</button>
            <div id="resultArea" style="display:none; margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px;">
                <div id="resultStatus"></div>
                <div id="resultContent" style="max-height: 600px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script>
        async function viewResult() {
            const sessionId = document.getElementById('view_session_id').value.trim();
            const resultArea = document.getElementById('resultArea');
            const resultStatus = document.getElementById('resultStatus');
            const resultContent = document.getElementById('resultContent');

            if (!sessionId) {
                alert('请输入Session ID');
                return;
            }

            resultArea.style.display = 'block';
            resultStatus.innerHTML = '正在加载...';
            resultStatus.className = 'loading';
            resultContent.textContent = '';

            try {
                const response = await fetch('https://ai-interview-agentai-interview.onrender.com/api/interview/' + sessionId);
                const data = await response.json();

                                   if (data.success && data.result) {
                        const r = data.result;
                        resultStatus.innerHTML = '<span style="color: green;">✅ 加载成功！</span>';

                        // 构建格式化的HTML显示
                        let html = '<div style="font-family: Arial, sans-serif;">';

                        // Session信息
                        html += '<div style="background: #f0f7ff; padding: 15px; border-radius: 8px; margin-bottom: 20px;">';
                        html += '<h3 style="margin: 0 0 10px 0; color: #1976d2;">📋 访谈信息</h3>';
                        html += '<p style="margin: 5px 0;"><strong>Session ID:</strong> ' + sessionId + '</p>';
                        if (r.role) html += '<p style="margin: 5px 0;"><strong>角色:</strong> ' + r.role + '</p>';
                        if (r.industry) html += '<p style="margin: 5px 0;"><strong>行业:</strong> ' + r.industry + '</p>';
                        if (r.sales_stage) html += '<p style="margin: 5px 0;"><strong>场景:</strong> ' + r.sales_stage + '</p>';
                        html += '</div>';

                        // 工作流程
                        if (r.workflow_map && r.workflow_map.length > 0) {
                            html += '<div style="margin-bottom: 20px;">';
                            html += '<h3 style="color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 8px;">🔄 工作流程 (' + r.workflow_map.length + ' 个阶段)</h3>';
                            r.workflow_map.forEach((stage, index) => {
                                html += '<div style="background: #f9f9f9; padding: 12px; margin: 10px 0; border-left: 4px solid #4caf50; border-radius: 4px;">';
                                html += '<h4 style="margin: 0 0 8px 0; color: #2e7d32;">阶段 ' + (index + 1) + ': ' + (stage.stage || stage.name || '未命名') + '</h4>';
                                if (stage.description) {
                                    html += '<p style="margin: 5px 0; color: #555;">' + stage.description + '</p>';
                                }
                                if (stage.actions && stage.actions.length > 0) {
                                    html += '<ul style="margin: 8px 0; padding-left: 20px;">';
                                    stage.actions.forEach(action => {
                                        html += '<li style="margin: 3px 0;">' + action + '</li>';
                                    });
                                    html += '</ul>';
                                }
                                html += '</div>';
                            });
                            html += '</div>';
                        }

                        // 最佳实践
                        if (r.best_practices && r.best_practices.length > 0) {
                            html += '<div style="margin-bottom: 20px;">';
                            html += '<h3 style="color: #f57c00; border-bottom: 2px solid #f57c00; padding-bottom: 8px;">⭐ 最佳实践 (' + r.best_practices.length + ' 条)</h3>';
                            r.best_practices.forEach((practice, index) => {
                                html += '<div style="background: #fff8e1; padding: 12px; margin: 10px 0; border-radius: 4px;">';
                                html += '<h4 style="margin: 0 0 8px 0; color: #f57c00;">实践 ' + (index + 1) + '</h4>';
                                if (typeof practice === 'string') {
                                    html += '<p style="margin: 5px 0;">' + practice + '</p>';
                                } else if (practice.title) {
                                    html += '<p style="margin: 5px 0; font-weight: bold;">' + practice.title + '</p>';
                                    if (practice.description) {
                                        html += '<p style="margin: 5px 0; color: #666;">' + practice.description + '</p>';
                                    }
                                }
                                html += '</div>';
                            });
                            html += '</div>';
                        }

                        // 方法论
                        if (r.methodologies && r.methodologies.length > 0) {
                            html += '<div style="margin-bottom: 20px;">';
                            html += '<h3 style="color: #7b1fa2; border-bottom: 2px solid #7b1fa2; padding-bottom: 8px;">📚 方法论 (' + r.methodologies.length + ' 个)</h3>';
                            r.methodologies.forEach((method, index) => {
                                html += '<div style="background: #f3e5f5; padding: 12px; margin: 10px 0; border-radius: 4px;">';
                                html += '<h4 style="margin: 0 0 8px 0; color: #7b1fa2;">' + (method.name || method.title || '方法论 ' + (index + 1)) + '</h4>';
                                if (method.description) {
                                    html += '<p style="margin: 5px 0;">' + method.description + '</p>';
                                }
                                if (method.steps && method.steps.length > 0) {
                                    html += '<ol style="margin: 8px 0; padding-left: 20px;">';
                                    method.steps.forEach(step => {
                                        html += '<li style="margin: 3px 0;">' + step + '</li>';
                                    });
                                    html += '</ol>';
                                }
                                html += '</div>';
                            });
                            html += '</div>';
                        }

                        // 常见模式
                        if (r.common_patterns && r.common_patterns.length > 0) {
                            html += '<div style="margin-bottom: 20px;">';
                            html += '<h3 style="color: #d32f2f; border-bottom: 2px solid #d32f2f; padding-bottom: 8px;">🔍 常见模式 (' + r.common_patterns.length + ' 个)</h3>';
                            r.common_patterns.forEach((pattern, index) => {
                                html += '<div style="background: #ffebee; padding: 12px; margin: 10px 0; border-radius: 4px;">';
                                html += '<h4 style="margin: 0 0 8px 0; color: #d32f2f;">' + (pattern.name || pattern.title || '模式 ' + (index + 1)) + '</h4>';
                                if (pattern.description) {
                                    html += '<p style="margin: 5px 0;">' + pattern.description + '</p>';
                                }
                                html += '</div>';
                            });
                            html += '</div>';
                        }

                        html += '</div>';
                        resultContent.innerHTML = html;
                    } else {
                        throw new Error('未找到该访谈结果');
                    }

            } catch (error) {
                resultStatus.innerHTML = '<span style="color: red;">❌ 加载失败: ' + error.message + '</span>';
                console.error('详细错误:', error);
            }
        }

        // 添加样式
        const style = document.createElement('style');
        style.textContent = '.loading { color: #666; }';
        document.head.appendChild(style);
    </script>

    <script src="script.js"></script>
</body>
</html>
